[package]
name = "stub-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
pinocchio = { version = "0.11.2", default-features = false, features = ["alloc", "cpi"] }
solana-instruction = { version = "3.5.0", default-features = false, features = ["wincode"] }
wincode = { version = "0.6.1", default-features = false, features = ["alloc"] }

[lib]
crate-type = ["cdylib"]

[workspace]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
