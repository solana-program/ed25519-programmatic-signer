[package]
name = "spl-ed25519-signer-interface"
version = "1.0.0"
description = "Interface for the SPL Ed25519 Signer program"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["rlib"]

[features]
codama = ["dep:codama-macros"]

[package.metadata.release]
pre-release-hook = ["sh", "-c", '[ "$DRY_RUN" = true ] || make -C "$WORKSPACE_ROOT" generate-idl-workspace']

[package.metadata.solana]
program-id = "EdSigVfK1DkeMrjFNDMjwfQaJPhPTtX7jW8uPv3oKEgN"

[lints]
workspace = true

[dependencies]
codama-macros = { workspace = true, optional = true }
solana-address = { workspace = true, features = ["curve25519", "decode", "wincode"] }
solana-message = { workspace = true, features = ["wincode"] }
solana-program-error = { workspace = true }
solana-signature = { workspace = true, features = ["wincode"] }
wincode = { workspace = true, features = ["alloc", "derive"] }
