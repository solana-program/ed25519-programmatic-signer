[package]
name = "spl-programmatic-signer-core"
version = "0.1.0"
description = "Shared core logic for SPL Programmatic Signer programs"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
exclude = ["tests/mock"]

[lib]
crate-type = ["rlib"]

[features]
client = ["dep:solana-instruction", "dep:solana-sdk-ids"]
codama = ["dep:codama-macros"]
program = ["dep:pinocchio"]

[lints]
workspace = true

[dependencies]
codama-macros = { workspace = true, optional = true }
pinocchio = { workspace = true, optional = true }
solana-address = { workspace = true, features = ["curve25519", "wincode"] }
solana-hash = { workspace = true, features = ["copy", "wincode"] }
solana-instruction = { workspace = true, features = ["wincode"], optional = true }
solana-message = { workspace = true, features = ["wincode"] }
solana-program-error = { workspace = true }
solana-sdk-ids = { workspace = true, optional = true }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
solana-zero-copy = { workspace = true, features = ["wincode"] }
wincode = { workspace = true, features = ["alloc", "derive"] }

[dev-dependencies]
mollusk-svm = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true, features = ["atomic"] }
solana-hash = { workspace = true, features = ["decode"] }
solana-instruction-error = { workspace = true }
solana-rent = { workspace = true }
solana-system-interface = { workspace = true, features = ["wincode"] }
test-case = { workspace = true }

[[test]]
name = "test_initialize"
required-features = ["client"]

[[test]]
name = "test_withdraw"
required-features = ["client"]

[[test]]
name = "test_consume_nonce"
required-features = ["client"]
