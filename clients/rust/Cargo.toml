[package]
name = "spl-programmatic-signer-rust"
version = "0.1.0"
description = "Rust helpers for the SPL programmatic signer stack"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solana-address = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true, features = ["wincode"] }
solana-message = { workspace = true, features = ["wincode"] }
solana-sdk-ids = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true, features = ["wincode"] }
solana-transaction = { workspace = true, features = ["verify", "wincode"] }
spl-ed25519-signer-client = { workspace = true }
spl-ed25519-signer-interface = { workspace = true }
spl-message-executor-client = { workspace = true }
spl-message-executor-interface = { workspace = true }
spl-nonce-client = { workspace = true }
spl-nonce-interface = { workspace = true }
wincode = { workspace = true, features = ["alloc"] }

[dev-dependencies]
mollusk-svm = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-program-error = { workspace = true }
solana-rent = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true, features = ["wincode"] }
solana-transaction = { workspace = true, features = ["verify", "wincode"] }
