[workspace]
resolver = "2"
members = [
    "clients/cli",
    "executor/client",
    "executor/interface",
    "executor/program",
    "nonce/client",
    "nonce/interface",
    "nonce/program",
    "signer/client",
    "signer/interface",
    "signer/program",
]

[workspace.package]
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/solana-program/ed25519-programmatic-signer"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
edition = "2021"

[workspace.metadata.release]
pre-release-commit-message = "Publish {{crate_name}} v{{version}}"
tag-message = "Publish {{crate_name}} v{{version}}"
consolidate-commits = false

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
brine-ed25519 = "0.10.0"
clap = "3.2.25"
codama-macros = "0.13.1"
indoc = "2.0.7"
jiff = { version = "0.2.27", default-features = false, features = ["std"] }
libtest-mimic = "0.8.2"
mollusk-svm = "0.15.0"
pinocchio = { version = "0.11.2", default-features = false }
rand = "0.9.4"
serde = "1.0.229"
serde_json = "1.0.151"
solana-account = "5.4.0"
solana-account-decoder = "4.4.1"
solana-account-decoder-client-types = "4.4.1"
solana-address = "2.9.0"
solana-clap-v3-utils = "4.4.1"
solana-cli-config = "4.4.1"
solana-cli-output = "4.4.1"
solana-clock = "4.0.0"
solana-commitment-config = "3.1.1"
solana-hash = "4.7.0"
solana-instruction = { version = "4.0.0", default-features = false }
solana-keypair = "4.0.1"
solana-loader-v3-interface = "9.0.0"
solana-message = { version = "5.1.0", default-features = false }
solana-native-token = "3.0.0"
solana-nonce = "3.4.0"
solana-program-error = "3.0.1"
solana-program-pack = "3.1.0"
solana-remote-wallet = "4.4.1"
solana-rent = "4.5.0"
solana-rpc = { version = "4.4.1", features = ["agave-unstable-api"] }
solana-rpc-client = { version = "4.4.1", default-features = false }
solana-rpc-client-types = "4.4.1"
solana-sanitize = "3.0.1"
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = "3.1.0"
solana-signature = { version = "3.6.0", default-features = false }
solana-signer = { version = "4.0.0", default-features = false }
solana-stake-interface = "5.1.1"
solana-system-interface = "3.3.0"
solana-test-validator = { version = "4.4.1", features = ["agave-unstable-api"] }
solana-transaction = { version = "5.1.0", default-features = false }
solana-transaction-status = "4.4.1"
solana-vote-interface = "7.4.0"
solana-zero-copy = "1.3.0"
spl-associated-token-account-interface = "2.0.0"
spl-memo-interface = "2.1.0"
spl-token-2022-interface = "3.1.2"
spl-token-interface = "3.0.0"
test-case = "3.3.1"
tempfile = "3.27.0"
tokio = "1.53.1"
wincode = { version = "0.6.3", default-features = false }

spl-ed25519-signer-client = { version = "0.1.0", path = "signer/client" }
spl-ed25519-signer-interface = { version = "1.0.0", path = "signer/interface" }
spl-message-executor-client = { version = "0.1.0", path = "executor/client" }
spl-message-executor-interface = { version = "1.0.0", path = "executor/interface" }
spl-nonce-client = { version = "0.1.0", path = "nonce/client" }
spl-nonce-interface = { version = "1.0.0", path = "nonce/interface" }

# Use Agave's RocksDB fork
[patch.crates-io]
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-alloc", "custom-heap", "custom-panic", "frozen-abi", "no-entrypoint"))',
]

[workspace.metadata.spellcheck]
config = "scripts/spellcheck.toml"
