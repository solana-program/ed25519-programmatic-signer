[workspace]
resolver = "2"
members = [
    "executor/client",
    "executor/interface",
    "executor/program",
    "nonce/client",
    "nonce/interface",
    "nonce/program",
    "signer/client",
    "signer/interface",
    "signer/program",
    "clients/rust",
    "clients/cli",
]

[workspace.package]
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/solana-program/nonce"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
edition = "2021"

[workspace.dependencies]
base64 = "0.22.1"
anyhow = "1.0.98"
brine-ed25519 = "0.7.0"
clap = "4.6.1"
pinocchio = { version = "0.11.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-account = "4.3.0"
solana-address = "2.6.1"
solana-derivation-path = "3.0.0"
solana-hash = "4.4.0"
solana-instruction = { version = "3.4.0", default-features = false }
solana-keypair = "3.1.2"
solana-message = { version = "4.4.0", default-features = false }
solana-program-error = "3.0.1"
solana-rent = "4.2.0"
solana-remote-wallet = { version = "4.1.1", features = ["agave-unstable-api"] }
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = "3.1.0"
solana-signature = "3.4.0"
solana-signer = { version = "3.0.1", default-features = false }
solana-system-interface = "3.2.0"
solana-transaction = { version = "4.1.3", default-features = false }
test-case = "3.3.1"
ureq = "3.3.0"
wincode = { version = "0.5.5", default-features = false }

spl-ed25519-signer-client = { version = "0.1.0", path = "signer/client" }
spl-ed25519-signer-interface = { version = "0.1.0", path = "signer/interface" }
spl-message-executor-client = { version = "0.1.0", path = "executor/client" }
spl-message-executor-interface = { version = "0.1.0", path = "executor/interface" }
spl-nonce-client = { version = "0.1.0", path = "nonce/client" }
spl-nonce-interface = { version = "0.1.0", path = "nonce/interface" }
spl-programmatic-signer-rust = { version = "0.1.0", path = "clients/rust" }

assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
uriparse = "0.6.4"

mollusk-svm = "0.14.0"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-alloc", "custom-heap", "custom-panic", "derive", "fetch", "frozen-abi", "no-entrypoint", "serde"))',
]

[workspace.metadata.spellcheck]
config = "scripts/spellcheck.toml"
