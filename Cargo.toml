[workspace]
resolver = "2"
members = [
    "client",
    "interface",
    "program",
    "signer/client",
    "signer/interface",
    "signer/program",
]

[workspace.package]
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/solana-program/nonce"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
edition = "2021"

[workspace.dependencies]
brine-ed25519 = "0.7.0"
pinocchio = { version = "0.11.2", default-features = false }
solana-account = "4.3.0"
solana-address = "2.6.1"
solana-hash = "4.4.0"
solana-instruction = { version = "3.4.0", default-features = false }
solana-keypair = "3.1.2"
solana-message = { version = "4.2.1", default-features = false }
solana-program-error = "3.0.1"
solana-rent = "4.2.0"
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = "3.1.0"
solana-signer = { version = "3.0.1", default-features = false }
solana-system-interface = "3.2.0"
solana-transaction = { version = "4.1.3", default-features = false }
test-case = "3.3.1"
wincode = { version = "0.5.5", default-features = false }

spl-ed25519-signer-client = { path = "signer/client" }
spl-ed25519-signer-interface = { path = "signer/interface" }

# TODO: remove after migrating to new executor system design
spl-ed25519-programmatic-signer-legacy-client = { path = "client" }
spl-ed25519-programmatic-signer-legacy-interface = { path = "interface" }

# TODO: pinned to mollusk's `4.1-beta` branch for a friendlier dep graph resolution w/ the new no-std crates
mollusk-svm = { git = "https://github.com/anza-xyz/mollusk", branch = "4.1-beta" }

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-alloc", "custom-heap", "custom-panic", "frozen-abi", "no-entrypoint"))',
]

[workspace.metadata.spellcheck]
config = "scripts/spellcheck.toml"
