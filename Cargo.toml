[workspace]
resolver = "2"
members = ["client", "interface", "program"]

[workspace.package]
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/solana-program/nonce"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
edition = "2021"

[workspace.dependencies]
brine-ed25519 = { version = "0.5.0", default-features = false }
mollusk-svm = "0.13.1"
pinocchio = { version = "0.11.0", default-features = false }
solana-account = "3.4.0"
solana-address = { version = "2.6.0", default-features = false }
solana-hash = { version = "4.2.0", default-features = false }
solana-instruction = { version = "3.3.0", default-features = false }
solana-keypair = "3.1.2"
solana-message = { version = "4.2.0", default-features = false, features = ["wincode"] }
solana-program-error = { version = "3.0.1", default-features = false }
solana-rent = { version = "3.1.0", default-features = false }
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = { version = "3.1.0", default-features = false }
solana-signature = { version = "3.3.0", default-features = false }
solana-signer = "3.0.0"
solana-system-interface = "2.0.0"
solana-transaction = { version = "4.1.2", default-features = false, features = ["wincode"] }
spl-ed25519-durable-signer-client = { path = "client" }
spl-ed25519-durable-signer-interface = { path = "interface" }
wincode = { version = "0.5.5", default-features = false }

[patch.crates-io]
solana-message = { path = "../solana-sdk/message" }
solana-short-vec = { path = "../solana-sdk/short-vec" }
solana-transaction = { path = "../solana-sdk/transaction" }
solana-transaction-error = { path = "../solana-sdk/transaction-error" }

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-alloc", "custom-heap", "custom-panic", "derive", "fetch", "frozen-abi", "no-entrypoint", "serde"))',
]

[workspace.metadata.spellcheck]
config = "scripts/spellcheck.toml"
