[workspace]
resolver = "2"
members = ["client", "interface", "program"]

[workspace.package]
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/solana-program/nonce"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
edition = "2021"

[workspace.dependencies]
brine-ed25519 = { version = "0.5.0", default-features = false }
mollusk-svm = "0.13.1"
pinocchio = { version = "0.11.0", default-features = false }
solana-account = "3.4.0"
solana-address = { version = "2.6.0", default-features = false }
solana-hash = { version = "4.2.0", default-features = false }
solana-instruction = { version = "3.3.0", default-features = false }
solana-keypair = "3.1.2"
solana-message = { git = "https://github.com/anza-xyz/solana-sdk", rev = "170db8d2ce5ac51b41d9aaf669371b605c9a8f6a", default-features = false, features = ["wincode"] }
solana-program-error = { version = "3.0.1", default-features = false }
solana-rent = { version = "3.1.0", default-features = false }
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = { version = "3.1.0", default-features = false }
solana-signature = { version = "3.3.0", default-features = false }
solana-signer = "3.0.0"
solana-system-interface = "2.0.0"
solana-transaction = { git = "https://github.com/anza-xyz/solana-sdk", rev = "170db8d2ce5ac51b41d9aaf669371b605c9a8f6a", default-features = false, features = ["wincode"] }
spl-ed25519-durable-signer-client = { path = "client" }
spl-ed25519-durable-signer-interface = { path = "interface" }
wincode = { version = "0.5.5", default-features = false }

# `solana-message` / `solana-transaction` are pinned (above) to the head of
# anza-xyz/solana-sdk#749 ("transaction: no-std"), which the program needs to
# parse the wrapped `VersionedTransaction` in `Submit` under `no_std`/SBF.
#
# That git branch ships its own `solana-address`, while pinocchio pulls
# `solana-address` from crates.io. Same version (2.6.1), two sources => two
# incompatible `Address` types. We can't fix this by patching `solana-message` /
# `solana-transaction` themselves: the branch is 4.x but mollusk (dev-dep) pins
# the 3.x line, and both majors must coexist.
#
# So we patch only the shared low-level crates to the same rev:
#   - solana-address:  unifies `Address` across pinocchio and the #749 crates.
#   - solana-sanitize: must move WITH it. mollusk's `solana-message 3.x` calls
#     `Address::sanitize()`; if `Address` is from the branch but `Sanitize` is
#     from crates.io `solana-sanitize`, the impl no longer matches and 3.x fails
#     to compile. Pinning both keeps the (Address, Sanitize) pair on one source.
#
# If a future mollusk bump drags in another base crate that splits the same way,
# add it here on the same rev for the same reason. Remove this whole block once
# #749 is released to crates.io and the deps point at the published version.
[patch.crates-io]
solana-address = { git = "https://github.com/anza-xyz/solana-sdk", rev = "170db8d2ce5ac51b41d9aaf669371b605c9a8f6a" }
solana-sanitize = { git = "https://github.com/anza-xyz/solana-sdk", rev = "170db8d2ce5ac51b41d9aaf669371b605c9a8f6a" }

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-alloc", "custom-heap", "custom-panic", "derive", "fetch", "frozen-abi", "no-entrypoint", "serde"))',
]

[workspace.metadata.spellcheck]
config = "scripts/spellcheck.toml"
