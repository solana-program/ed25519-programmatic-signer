[package]
name = "spl-nonce-interface"
version = "0.1.0"
description = "Interface for the SPL Nonce program"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["rlib"]

[features]
codama = ["dep:codama-macros"]

[package.metadata.solana]
program-id = "Noncediea1fH12usShuQAz28UhgAeuE5Maf32LsMUQB"

[lints]
workspace = true

[dependencies]
codama-macros = { workspace = true, optional = true }
solana-address = { workspace = true, features = ["decode", "wincode"] }
solana-hash = { workspace = true, features = ["wincode"] }
solana-program-error = { workspace = true }
solana-sha256-hasher = { workspace = true, features = ["sha2"] }
wincode = { workspace = true, features = ["derive"] }

[dev-dependencies]
solana-hash = { workspace = true, features = ["decode"] }
test-case = { workspace = true }
wincode = { workspace = true, features = ["alloc"] }
