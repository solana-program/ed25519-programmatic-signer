[package]
name = "spl-nonce-client"
version = "0.1.0"
description = "Off-chain client helpers for the SPL Nonce program"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["rlib"]

[features]
cpi = ["dep:pinocchio"]

[lints]
workspace = true

[dependencies]
pinocchio = { workspace = true, features = ["cpi"], optional = true }
solana-address = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true, features = ["wincode"] }
solana-sdk-ids = { workspace = true }
solana-system-interface = { workspace = true, features = ["wincode"] }
spl-nonce-interface = { workspace = true }
wincode = { workspace = true, features = ["alloc"] }
